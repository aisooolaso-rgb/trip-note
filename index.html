<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b55"><title>Trip Note</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#183349;background:#f4f7f9}*{box-sizing:border-box}body{margin:0}.app{max-width:600px;margin:auto;min-height:100dvh;background:#fff;padding:22px 18px 100px}header{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;color:#146b87;letter-spacing:.04em}.sub{color:#71818d;font-size:12px}.panel{background:#eff6f8;border-radius:18px;padding:16px;margin:18px 0}h1{font-size:24px;margin:6px 0}h2{font-size:17px}.days{display:flex;gap:8px;overflow:auto}.day{border:1px solid #dce8ed;border-radius:12px;padding:12px;min-width:86px;background:white;color:#214153}.day.active{background:#123b55;color:white}.item{display:flex;gap:12px;margin:13px 0}.time{width:55px;flex-shrink:0;color:#657a86;font-size:13px;padding-top:12px}.event{flex:1;border:1px solid #e0e9ed;border-radius:14px;padding:13px;min-width:0}.event b{display:block}.meta{font-size:12px;color:#708491;margin-top:6px}.travel{font-size:12px;color:#3d8099;margin:4px 0 4px 68px;padding:7px 12px;background:#f1f8fa;border-radius:9px}button{font:inherit;cursor:pointer}.primary{border:0;background:#126b86;color:white;border-radius:12px;padding:14px 18px;font-weight:700}.secondary{border:1px solid #cbdde4;background:white;color:#24516a;border-radius:12px;padding:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.actions button{flex:1}dialog{border:0;border-radius:20px;padding:22px;width:calc(100% - 28px);max-width:520px;box-shadow:0 15px 50px #0003}dialog::backdrop{background:#102c3a99}label{display:block;font-size:13px;font-weight:700;margin:13px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #cbdce3;border-radius:10px;font:inherit;background:white}textarea{min-height:72px}.hint{font-size:12px;color:#6d7f89;line-height:1.6}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.empty{padding:28px;text-align:center;color:#758996}.fixed{color:#a36a24}footer{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e5edf0;padding:12px max(18px,calc((100vw - 560px)/2));font-size:12px;color:#71838d;text-align:center}@media print{@page{size:A4;margin:14mm}body{background:#fff;color:#172e3c}.app,footer,dialog{display:none!important}#printSheet{display:block!important}#printSheet h1{font-size:21px;margin:0 0 4px}#printSheet h2{font-size:15px;border-bottom:2px solid #24516a;padding-bottom:5px;margin:20px 0 8px;break-after:avoid}#printSheet .printDay{break-inside:avoid-page}#printSheet table{width:100%;border-collapse:collapse;font-size:10px;table-layout:fixed}#printSheet th,#printSheet td{border:1px solid #bdcbd2;padding:7px 6px;vertical-align:top;overflow-wrap:anywhere}#printSheet th{background:#eff6f8;text-align:left}#printSheet tr{break-inside:avoid}#printSheet .muted{color:#526a77;font-size:10px}}#printSheet{display:none}</style></head><body><div class="app"><header><div><div class="brand">✈ TRIP NOTE</div><div class="sub">旅行を、もっと自由に。</div></div><button class="secondary" id="backup">保存データを書き出す</button></header><section class="panel"><div class="sub">MY TRIP · 試作版</div><h1 id="tripTitle">北海道旅行</h1><div class="sub">まず場所を追加して、順番と滞在時間を決めましょう。</div><div class="actions"><button class="secondary" id="rename">旅行名・日付</button><button class="secondary" id="import">データを読み込む</button></div></section><div class="days" id="days"></div><h2>旅程</h2><div id="timeline"></div><div class="actions"><button class="primary" id="add">＋ 場所・予定を追加</button><button class="secondary" id="preview">時刻を再計算</button><button class="secondary" id="pdf">行程表をPDFにする</button></div><p class="hint">移動時間は手動入力の試作版です。Googleマップは経路確認用に開きます。移動時間の自動取得は後の段階で実装します。旅行データはこの端末にのみ保存されます。</p></div><footer>Trip Note · ローカル試作版（この端末内に保存）</footer><dialog id="editor"><form method="dialog" id="form"><h2 id="formTitle">場所・予定を追加</h2><label>場所・予定名</label><input id="name" required placeholder="例：サイロ展望台"><label>分類</label><select id="kind"><option>観光</option><option>食事</option><option>宿泊</option><option>移動</option><option>その他</option></select><div class="row"><div><label>滞在時間（分）</label><input id="duration" type="number" min="0" max="1440" value="30" required></div><div><label>直前の場所からの移動（分）</label><input id="travel" type="number" min="0" max="1440" value="0" required></div></div><label>住所・地図検索用の場所</label><input id="address" placeholder="例：洞爺湖 サイロ展望台"><label>メモ</label><textarea id="memo"></textarea><label><input type="checkbox" id="fixed" style="width:auto"> 時刻固定（後続の再計算でも動かさない）</label><div id="fixedWrap" hidden><label>固定開始時刻</label><input id="fixedTime" type="time" value="10:00"></div><div class="actions"><button class="secondary" value="cancel">キャンセル</button><button class="primary" id="save" value="default">保存</button></div></form></dialog><dialog id="settings"><h2>旅行の設定</h2><label>旅行名</label><input id="titleInput"><label>開始日</label><input type="date" id="dateInput"><label>日数</label><input type="number" min="1" max="30" id="daysInput"><label>各日の出発時刻</label><input type="time" id="startInput"><div class="actions"><button class="secondary" id="settingsCancel">キャンセル</button><button class="primary" id="settingsSave">保存</button></div></dialog><input type="file" id="file" accept="application/json" hidden><div id="printSheet"></div><script>
const key='tripnote-prototype-v1';const initial={title:'北海道旅行',date:'2026-09-19',count:2,day:0,starts:{0:'07:15',1:'09:00'},events:[{id:'a',day:0,name:'朝食（どん兵衛）',kind:'食事',duration:30,travel:0,address:'',memo:'',fixed:false},{id:'b',day:0,name:'財田自然観察道',kind:'観光',duration:10,travel:150,address:'財田自然観察道',memo:'',fixed:false},{id:'c',day:0,name:'サイロ展望台',kind:'観光',duration:15,travel:10,address:'サイロ展望台',memo:'',fixed:false},{id:'d',day:0,name:'有珠山ロープウェイ',kind:'観光',duration:60,travel:20,address:'有珠山ロープウェイ',memo:'',fixed:false}]};let data;try{data=JSON.parse(localStorage.getItem(key))||structuredClone(initial)}catch{data=structuredClone(initial)}let editing=null;let preview=null;const $=id=>document.getElementById(id);const persist=()=>localStorage.setItem(key,JSON.stringify(data));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const minutes=s=>Number(s.slice(0,2))*60+Number(s.slice(3,5));const clock=n=>String(Math.floor(n/60)%24).padStart(2,'0')+':'+String(n%60).padStart(2,'0');const dateAt=i=>{let d=new Date(data.date+'T12:00:00');d.setDate(d.getDate()+i);return `${d.getMonth()+1}/${d.getDate()}`};function calc(day){let t=minutes(data.starts[day]||'09:00');return data.events.filter(e=>e.day===day).map(e=>{let next=t+Number(e.travel||0);if(e.fixed&&e.fixedTime)next=minutes(e.fixedTime);let clash=e.fixed&&next<t+Number(e.travel||0);t=next+Number(e.duration||0);return {...e,start:next,end:t,clash}})}function render(){ $('tripTitle').textContent=data.title;$('days').innerHTML=Array.from({length:data.count},(_,i)=>`<button class="day ${data.day===i?'active':''}" data-day="${i}">${dateAt(i)}<br><small>DAY ${i+1}</small></button>`).join('');let evs=calc(data.day);$('timeline').innerHTML=evs.length?evs.map((e,i)=>`${e.travel?`<div class="travel">↳ 移動 ${e.travel}分 ${e.address?`<button class="secondary" style="padding:4px 8px" data-map="${esc(e.id)}">地図</button>`:''}</div>`:''}<div class="item"><div class="time">${clock(e.start)}<br>〜${clock(e.end)}</div><div class="event"><b>${esc(e.name)} ${e.fixed?'<span class="fixed">🔒</span>':''}</b><div class="meta">${esc(e.kind)} · 滞在 ${e.duration}分 ${e.clash?' · ⚠ 固定時刻に矛盾':''}</div>${e.memo?`<div class="meta">${esc(e.memo)}</div>`:''}<div class="actions"><button class="secondary" data-edit="${esc(e.id)}">編集</button><button class="secondary" data-up="${esc(e.id)}">↑</button><button class="secondary" data-down="${esc(e.id)}">↓</button><button class="secondary" data-delete="${esc(e.id)}">削除</button></div></div></div>`).join(''):'<div class="empty">予定がありません。「場所・予定を追加」から始めてください。</div>';document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{data.day=Number(b.dataset.day);persist();render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('この予定を削除しますか？')){data.events=data.events.filter(e=>e.id!==b.dataset.delete);persist();render()}});for(let dir of ['up','down'])document.querySelectorAll(`[data-${dir}]`).forEach(b=>b.onclick=()=>{let id=b.dataset[dir],ix=data.events.findIndex(e=>e.id===id),other=dir==='up'?ix-1:ix+1;if(other<0||other>=data.events.length||data.events[other].day!==data.day)return;[data.events[ix],data.events[other]]=[data.events[other],data.events[ix]];persist();render()});document.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>{let e=data.events.find(x=>x.id===b.dataset.map);window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(e.address||e.name),'_blank','noopener')})}
function openEdit(id){editing=id;let e=data.events.find(x=>x.id===id);$('formTitle').textContent=e?'予定を編集':'場所・予定を追加';for(let k of ['name','kind','duration','travel','address','memo','fixed','fixedTime']){let el=$(k);el.type==='checkbox'?el.checked=!!e?.[k]:el.value=e?.[k]??({kind:'観光',duration:30,travel:0,fixedTime:'10:00'}[k]??'')}$('fixedWrap').hidden=!$('fixed').checked;$('editor').showModal()}$('fixed').onchange=()=>$('fixedWrap').hidden=!$('fixed').checked;$('add').onclick=()=>openEdit(null);$('form').onsubmit=e=>{if(e.submitter?.value==='cancel')return;let obj={id:editing||String(Date.now()),day:data.day};for(let k of ['name','kind','address','memo','fixedTime'])obj[k]=$(k).value;for(let k of ['duration','travel'])obj[k]=Number($(k).value);obj.fixed=$('fixed').checked;if(!obj.name.trim()||obj.duration<0||obj.travel<0){e.preventDefault();return}if(editing){let ix=data.events.findIndex(x=>x.id===editing);data.events[ix]=obj}else data.events.push(obj);persist();render()};$('rename').onclick=()=>{$('titleInput').value=data.title;$('dateInput').value=data.date;$('daysInput').value=data.count;$('startInput').value=data.starts[data.day]||'09:00';$('settings').showModal()};$('settingsCancel').onclick=()=>$('settings').close();$('settingsSave').onclick=()=>{if(!$('dateInput').value||!$('titleInput').value.trim())return alert('旅行名と開始日を入力してください');data.title=$('titleInput').value.trim();data.date=$('dateInput').value;data.count=Math.max(1,Math.min(30,Number($('daysInput').value)||1));data.day=Math.min(data.day,data.count-1);data.starts[data.day]=$('startInput').value||'09:00';persist();$('settings').close();render()};$('preview').onclick=()=>{let s=calc(data.day);alert(s.length?s.map(e=>`${clock(e.start)}〜${clock(e.end)}  ${e.name}${e.clash?'（固定時刻の矛盾）':''}`).join('\n'):'予定がありません')};function preparePrint(){let html=`<h1>${esc(data.title)}</h1><div class="muted">旅行行程表 · ${esc(data.date)}から${data.count}日間</div>`;for(let i=0;i<data.count;i++){let evs=calc(i);html+=`<section class="printDay"><h2>DAY ${i+1}　${esc(dateAt(i))}</h2><table><thead><tr><th style="width:21%">時間</th><th style="width:30%">場所・予定</th><th style="width:14%">分類</th><th style="width:35%">備考</th></tr></thead><tbody>`;if(!evs.length)html+='<tr><td colspan="4">予定なし</td></tr>';for(let e of evs){if(e.travel)html+=`<tr><td>${esc(clock(e.start-e.travel))}〜${esc(clock(e.start))}</td><td>移動</td><td>移動</td><td>${Number(e.travel)}分</td></tr>`;html+=`<tr><td>${esc(clock(e.start))}〜${esc(clock(e.end))}</td><td>${esc(e.name)}</td><td>${esc(e.kind)}</td><td>${esc(e.memo||'')}${e.clash?' ※固定時刻に矛盾':''}</td></tr>`}html+='</tbody></table></section>'} $('printSheet').innerHTML=html} $('pdf').onclick=()=>{preparePrint();window.print()};$('backup').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tripnote-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!Array.isArray(v.events)||typeof v.title!=='string'||!v.starts||!Number.isInteger(v.count)||v.count<1||v.count>30)throw Error();if(confirm('現在の旅行データを読み込んだ内容で置き換えますか？')){data=v;persist();render()}}catch{alert('読み込めないファイルです')}e.target.value=''};render();
</script></body></html>
